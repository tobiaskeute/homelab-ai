---
x-defaults: &x-defaults
  env_file:
    - path: ./.env
      required: false
  restart: no

services:
  openwebui:
    <<: *x-defaults
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
  backend:
    <<: *x-defaults
    build: .
    volumes:
      - ./backend/secrets.json:/backend/secrets.json:ro
volumes:
  open-webui: